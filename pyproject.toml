[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filepilot"
version = "0.1.0"
description = "A safe Python CLI for organizing and renaming messy folders."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "FilePilot Contributors" }
]
license = { text = "MIT" }
keywords = ["cli", "files", "organizer", "typer", "rich"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
filepilot = "filepilot.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

